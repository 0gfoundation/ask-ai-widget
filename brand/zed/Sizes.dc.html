<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0B0A12; color: #F1ECFA; font-family: "Geist", "Helvetica Neue", Arial, sans-serif; font-weight: 300; }
    a { color: #C98BFF; } a:hover { color: #E3C1FF; }
  </style>
</helmet>
<div style="width: 1200px; min-height: 640px; box-sizing: border-box; padding: 40px 48px; background: #0B0A12; display: flex; flex-direction: column; gap: 24px;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C98BFF; font-weight: 500;">01 · Sizes</div>
    <div style="font-size: 34px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 300; color: #F1ECFA;">The same drawing from 96px to 16px</div>
    <div style="font-size: 14px; color: #A69DBE; max-width: 700px;">Outline and eyes are computed from the render size, so the small versions are not just shrunk. The favicon is rendered from this same drawing.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{grounds}}" as="g" hint-placeholder-count="3">
      <div style="position: relative; display: flex; align-items: flex-end; gap: 28px; padding: 18px 22px; border-radius: 12px; background: {{g.bg}}; border: 1px solid {{g.border}};">
        <sc-for list="{{sizes}}" as="sz" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <svg viewBox="0 0 120 120" width="{{sz.px}}" height="{{sz.px}}" role="img" aria-label="Zed">
              <circle cx="27" cy="29" r="16" fill="{{visor}}" stroke="{{edge}}" stroke-width="{{sz.s}}"></circle>
              <circle cx="93" cy="29" r="16" fill="{{visor}}" stroke="{{edge}}" stroke-width="{{sz.s}}"></circle>
              <circle cx="60" cy="64" r="44" fill="{{shell}}" stroke="{{edge}}" stroke-width="{{sz.s}}"></circle>
              <rect x="24" y="44" width="72" height="46" rx="23" fill="{{visor}}" stroke="#0E0A16" stroke-width="{{sz.s}}"></rect>
              <g fill="{{eye}}" style="filter: drop-shadow(0 0 3px {{glow}});">
                <rect x="{{sz.x1}}" y="{{sz.y}}" width="{{sz.w}}" height="{{sz.h}}" rx="{{sz.rx}}"></rect>
                <rect x="{{sz.x2}}" y="{{sz.y}}" width="{{sz.w}}" height="{{sz.h}}" rx="{{sz.rx}}"></rect>
              </g>
              <path d="M32 54 Q38 47 52 47" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round"></path>
            </svg>
            <div style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{g.label}};">{{sz.px}}</div>
          </div>
        </sc-for>
        <div style="position: absolute; right: 18px; top: 14px; font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: {{g.label}};">{{g.name}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"shell":{"editor":"color","default":"#F3EEFA","section":"Colours"},"edge":{"editor":"color","default":"#B29CDB","section":"Colours"},"visor":{"editor":"color","default":"#1A1326","section":"Colours"},"eye":{"editor":"color","default":"#D9B3FF","section":"Colours"},"glow":{"editor":"color","default":"#B75FFF","section":"Colours"},"eyeW":{"editor":"int","default":10,"min":6,"max":16,"section":"Eyes"},"eyeH":{"editor":"int","default":15,"min":6,"max":26,"section":"Eyes"},"$preview":{"width":1200,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const eyeW = Number(p.eyeW ?? 10), eyeH = Number(p.eyeH ?? 15);
    const stroke = (px) => { const dp = px <= 16 ? 1 : px <= 24 ? 1.3 : px <= 32 ? 1.6 : 2; return Math.min(3.2, dp * 120 / px); };
    const sizes = [96, 48, 32, 24, 16].map((px) => {
      const w = px <= 32 ? eyeW + 1 : eyeW, h = px <= 32 ? eyeH + 2 : eyeH;
      return { px, s: stroke(px), w, h, y: 67 - h / 2, x1: 45 - w / 2, x2: 75 - w / 2, rx: w / 2 };
    });
    return {
      shell: p.shell ?? '#F3EEFA', edge: p.edge ?? '#B29CDB', visor: p.visor ?? '#1A1326',
      eye: p.eye ?? '#D9B3FF', glow: p.glow ?? '#B75FFF',
      sizes,
      grounds: [
        { name: 'White', bg: '#FFFFFF', border: '#DDD3EC', label: '#665C7A' },
        { name: 'Lavender fade', bg: 'radial-gradient(60% 120% at 12% 0%, rgba(232,160,235,0.55) 0%, transparent 70%), radial-gradient(50% 120% at 88% 100%, rgba(146,0,225,0.10) 0%, transparent 70%), linear-gradient(90deg, #EAC6EC 0%, #D7C8EF 45%, #E6E0F5 78%, #F6F3FB 100%)', border: '#DDD3EC', label: '#665C7A' },
        { name: 'Dark', bg: '#0B0A12', border: '#2A2438', label: '#A69DBE' },
      ],
    };
  }
}
</script>
</body>
</html>
