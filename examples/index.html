<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask Zed Widget — Demo</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f5f5f7;
        color: #0a0a0a;
      }
      .page {
        max-width: 640px;
        margin: 0 auto;
        padding: 4rem 1.5rem 8rem;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      p {
        line-height: 1.6;
        color: #444;
      }
      .controls {
        margin: 2rem 0;
        padding: 1rem;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
      }
      .controls label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
        color: #333;
      }
      .controls input, .controls select {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font: inherit;
        margin-bottom: 0.75rem;
      }
      .fullpage {
        height: 70vh;
        margin: 2rem 0;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #111; color: #f5f5f5; }
        .controls { background: #1a1a1a; border-color: #2a2a2a; }
        .controls input, .controls select { background: #0a0a0a; color: #f5f5f5; border-color: #2a2a2a; }
        p { color: #d4d4d8; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
